<!DOCTYPE html>
<html lang="en">
<!--
  base.html — Master template for ALL pages.

  WHY: Instead of repeating the <head>, navbar, and footer on every page,
  we write them ONCE here. Other pages "extend" this template and only
  fill in the content that changes (using Jinja2 blocks).

  WHAT'S LOADED:
  - Tailwind CSS (CDN) — utility-first CSS framework for styling
  - Chart.js (CDN) — JavaScript library for drawing charts (used later)
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title — each child template can override this -->
    <title>{% block title %}Cloud Security Scanner{% endblock %}</title>

    <!-- Tailwind CSS from CDN (no install needed) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js from CDN (we'll use it for the dashboard later) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- NAVIGATION BAR -->
    <nav class="bg-gray-900 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">

            <!-- App name / logo -->
            <a href="/" class="text-xl font-bold flex items-center gap-2">
                🛡️ Cloud Security Scanner
            </a>

            <!-- Nav links (we'll add Login/Register here in Step 4-5) -->
            <div class="flex items-center gap-4">
                <a href="/" class="hover:text-blue-400 transition">Dashboard</a>
                <!-- More links will be added later -->
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT AREA -->
    <!-- Each child page fills this block with its own content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        {% block content %}
        <!-- Child templates put their HTML here -->
        {% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-900 text-gray-400 text-center py-4 mt-12">
        <p>Cloud Security Misconfiguration Detector — College Project 2024</p>
    </footer>

</body>
</html>
