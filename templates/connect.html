{% extends "base.html" %}

{% block title %}Connect AWS Credentials — Cloud Security Scanner{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-xl shadow p-8">
    <h2 class="text-2xl font-bold text-gray-800 mb-2">Configure AWS Connection</h2>
    <p class="text-sm text-gray-500 mb-6">Connect to LocalStack for local testing or real AWS credentials for cloud scanning.</p>

    {% if error %}
    <div class="mb-6 p-4 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-sm">
        ⚠️ {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('connect_aws') }}" class="space-y-6">

        <!-- Mode Selection -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Connection Target</label>
            <div class="grid grid-cols-2 gap-4">
                <label class="border rounded-lg p-4 flex items-center gap-3 cursor-pointer hover:bg-gray-50">
                    <input type="radio" name="mode" value="localstack" {% if aws_config.mode == 'localstack' %}checked{% endif %} onchange="toggleEndpoint(true)">
                    <div>
                        <div class="font-bold text-sm text-gray-800">LocalStack</div>
                        <div class="text-xs text-gray-400">Local emulation</div>
                    </div>
                </label>
                <label class="border rounded-lg p-4 flex items-center gap-3 cursor-pointer hover:bg-gray-50">
                    <input type="radio" name="mode" value="aws" {% if aws_config.mode == 'aws' %}checked{% endif %} onchange="toggleEndpoint(false)">
                    <div>
                        <div class="font-bold text-sm text-gray-800">AWS Cloud</div>
                        <div class="text-xs text-gray-400">Real AWS account</div>
                    </div>
                </label>
            </div>
        </div>

        <!-- Credentials -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">AWS Access Key ID</label>
                <input type="text" name="aws_access_key" value="{{ aws_config.aws_access_key }}" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 font-mono text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">AWS Secret Access Key</label>
                <input type="password" name="aws_secret_key" value="{{ aws_config.aws_secret_key }}" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 font-mono text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">AWS Region</label>
                <input type="text" name="region" value="{{ aws_config.region }}" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <div id="endpoint-container" class="{% if aws_config.mode != 'localstack' %}hidden{% endif %}">
                <label class="block text-sm font-medium text-gray-700 mb-1">LocalStack Endpoint URL</label>
                <input type="text" name="endpoint_url" value="{{ aws_config.endpoint_url or 'http://localhost:4566' }}" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm font-mono">
            </div>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition text-sm">
            Save & Validate Connection
        </button>

    </form>
</div>

<script>
function toggleEndpoint(show) {
    const container = document.getElementById('endpoint-container');
    if (show) {
        container.classList.remove('hidden');
    } else {
        container.classList.add('hidden');
    }
}
</script>
{% endblock %}
